<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://kit.fontawesome.com/12c969ea13.js" crossorigin="anonymous"></script>
</head>
<body>
    <!--Side panel to choose tasks-->
    <aside class="task-panel">

        <!--quick sorting panel-->
        <section class="task-panel__task-quick-access">
            
        </section>

        <!--Storage of all list-->
        <section class="task-panel__list-storage">
            <div class="task-panel__list-storage-inner">

                <div class="task-panel__list-storage list">
                    <span class="project-title active">
                        <div>
                            <i class="fa-solid fa-layer-group"></i>
                            <h4 id="list-side-title">List title</h4>
                        </div>
                        <i class="menu-list-options fa-solid fa-ellipsis"></i>
                    </span>
                    <div class="tasks">
                        <p id="list-side-task" class="task-in-list">Title 1</p>
                        <p id="list-side-task" class="task-in-list">Title 2</p>
                        <p id="list-side-task" class="task-in-list">Title 3</p>
                    </div>
                </div>

                <div class="task-panel__list-storage list">
                    <span class="project-title">
                        <div>
                            <i class="fa-solid fa-layer-group"></i>
                            <h4>List title</h4>
                        </div>
                        <i class="menu-list-options fa-solid fa-ellipsis"></i>
                    </span>
                    <div class="tasks">
                        <p class="task-in-list">Title 1</p>
                        <p class="task-in-list">Title 2</p>
                        <p class="task-in-list">Title 3</p>
                    </div>

                    <!--List menu
                    <menu class="menu-list">
                        <div class="menu-list__element">
                            <i class="fa-solid fa-pen"></i>
                            <p>Edit list</p>
                        </div>
                        <div class="menu-list__element">
                            <i class="fa-solid fa-trash"></i>
                            <p>Delete</p>
                        </div>
                    </menu>
                    -->
                </div>

                <div class="task-panel__list-storage add-list">
                    

                </div>
                
            </div>
        </section>

        <!--New list section-->
        <section class="task-panel__add-list">

            <div class="task-panel__add-list--inner">
                <div class="add-list-button">
                    <i class="fa-solid fa-plus"></i>
                    <p>New list</p>
                </div>
                <i class="fa-solid fa-ellipsis"></i>

                <!--New list menu-->

            </div>
        </section>
    </aside>


    <!--Main board with list of tasks-->
    <main class="task-board">
        <div class="task-board__inner">
            <!--list of tasks-->
            <div class="task-board__title-wrapper">
                <div>
                    <span class="task-board__list-title">
                        <i class="fa-solid fa-layer-group"></i>
                        <h2>List title</h2>
                        <i class="fa-solid fa-ellipsis"></i>
                    </span>
                    <p class="task-board__description">A new description for the title of a new list</p>
                </div>

                <div class="add-task-button">
                    <i class="fa-solid fa-plus"></i>
                    <p>Task</p>
                </div>
            </div>

            <!--task in list-->
            <div class="task-board task-list">
                <div class="task-board task-list-wrapper task-title">
                    <div class="task-board task-list__checkbox-wrapper">
                        <div class="task-board task-list__checkbox">
                            <i class="fa-regular fa-circle"></i>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h3>Title 1</h3>
                    </div>

                    <div class="task-board task-list__markers-wrapper">
                        
                    </div>

                    <i class="fa-solid fa-ellipsis"></i>

                </div>

                <div class="task-board task-list-wrapper task-title">
                    <div class="task-board task-list__checkbox-wrapper">
                        <div class="task-board task-list__checkbox">
                            <i class="fa-regular fa-circle"></i>
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h3>Title 1</h3>
                    </div>

                    <div class="task-board task-list__markers-wrapper">
                        <div class="date-marker">
                            <p>12.06.2024</p>
                        </div>
                        <div class="priority-marker">
                            <p>High</p>
                        </div>
                    </div>

                    <i class="fa-solid fa-ellipsis"></i>

                    <!-- Popup у кажого task
                    <div class="add-list__popup">
                        <span class="dropdown-add-date">
                            <p class="dropdown-tag">Add date</p>
                            <input type="date" name="dropdown-date" id="dropdown-date">
                        </span>
                        <span class="dropdown-wrapper">
                            <p class="dropdown-tag">Add priority</p>
                        </span>
                    </div>
                    -->
                </div>

                <!--Input for new task-->
                <!--<div class="task-board task-list-wrapper task-title add-task">
                    <div class="task-board task-list__checkbox-wrapper">
                        <input type="text" autocomplete="off" name="task-input" id="task-input" placeholder="Input new task">
                    </div>
                    <span class="task-add-done-button">
                        <i class="fa-solid fa-check"></i>
                        <p>Done</p>
                    </span>
                </div>-->
                
            </div>

        
        </div>
    </main>


</body>
</html>
